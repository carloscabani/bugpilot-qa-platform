name: BugPilot CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  # =========================
  # BACKEND
  # =========================

  backend:

    name: Backend Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      JWT_SECRET: github_actions_test_secret
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: bugpilot
      DB_PASSWORD: ci_test_password
      DB_NAME: bugpilot_test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run Vitest and Supertest
        run: npm test


  # =========================
  # FRONTEND
  # =========================

  frontend:

    name: Frontend Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React
        run: npm run build


  # =========================
  # PYTHON
  # =========================

  intelligence:

    name: Python Intelligence Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: intelligence-engine

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: intelligence-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Python tests
        run: python -m pytest -v


  # =========================
  # DOCKER
  # =========================

  docker:

    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - intelligence

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t bugpilot-backend:ci \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -t bugpilot-frontend:ci \
            ./frontend

      - name: Build intelligence image
        run: |
          docker build \
            -t bugpilot-intelligence:ci \
            ./intelligence-engine